name: Build Windows MSI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build.ps1'
      - '.github/workflows/windows-msi.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: ./build.ps1
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: FocusGate-Windows-MSI
          path: FocusGate.msi
          if-no-files-found: error
